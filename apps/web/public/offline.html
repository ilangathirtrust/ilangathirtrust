<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Ilangathir Trust</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #FFFFFF;
        color: #13294B;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(19, 41, 75, 0.08);
      }
      img { width: 64px; height: 64px; object-fit: contain; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; color: #475569; line-height: 1.6; margin: 0 0 10px; }
      button {
        margin-top: 14px;
        background: #13294B;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logos/circular-icon.png" alt="Ilangathir Trust" />
      <h1>You are currently offline</h1>
      <p>Please check your internet connection and tap below to reload Ilangathir Trust.</p>
      <p>இணைய இணைப்பை சரிபார்த்து மீண்டும் முயற்சிக்கவும்.</p>
      <button type="button" onclick="window.location.reload()">Try Again / மீண்டும் முயற்சிக்க</button>
    </div>
  </body>
</html>
