# Ilangathir Trust — Production Nginx Configuration

server {
    listen 80;
    server_name ilangathirtrust.com;
    return 301 https://www.ilangathirtrust.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ilangathirtrust.com;
    return 301 https://www.ilangathirtrust.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ilangathirtrust.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.ilangathirtrust.com;

    root /var/www/ilangathirtrust/apps/admin/dist;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.ilangathirtrust.com;
    client_max_body_size 55M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
